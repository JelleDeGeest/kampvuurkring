services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.le.acme.email=admin@scoutssintjohannes.be"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    networks: [ app-network ]
    restart: unless-stopped

  frontend:
    container_name: frontend-prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_CLARITY_PROJECT_ID=${NEXT_PUBLIC_CLARITY_PROJECT_ID}
    # ⚠️ Remove the external 3000 port mapping — Traefik will handle it
    # ports:
    #   - "0.0.0.0:${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URI=${DATABASE_URI:-postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable}
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - PAYLOAD_PUBLIC_SERVER_URL=${PAYLOAD_PUBLIC_SERVER_URL:-https://www.scoutssintjohannes.be}
      - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL:-https://www.scoutssintjohannes.be}
      - CDN_PUBLIC_URL=${CDN_PUBLIC_URL}
      - PAYLOAD_PUBLIC_DRAFT_SECRET=${PAYLOAD_PUBLIC_DRAFT_SECRET}
      - NEXT_PUBLIC_DRAFT_SECRET=${NEXT_PUBLIC_DRAFT_SECRET}
      - REVALIDATION_KEY=${REVALIDATION_KEY}
      - NEXT_PRIVATE_REVALIDATION_KEY=${NEXT_PRIVATE_REVALIDATION_KEY}
      - HOSTNAME=0.0.0.0
      - S3_ENDPOINT=http://minio:9000
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      # Main site router for www domain
      - "traefik.http.routers.site.rule=Host(`www.scoutssintjohannes.be`)"
      - "traefik.http.routers.site.entrypoints=websecure"
      - "traefik.http.routers.site.tls=true"
      - "traefik.http.routers.site.tls.certresolver=le"
      - "traefik.http.routers.site.priority=1"
      - "traefik.http.services.site.loadbalancer.server.port=3000"
      # Redirect apex domain to www
      - "traefik.http.routers.apex-redirect.rule=Host(`scoutssintjohannes.be`)"
      - "traefik.http.routers.apex-redirect.entrypoints=websecure"
      - "traefik.http.routers.apex-redirect.tls=true"
      - "traefik.http.routers.apex-redirect.tls.certresolver=le"
      - "traefik.http.routers.apex-redirect.middlewares=apex-to-www"
      - "traefik.http.middlewares.apex-to-www.redirectregex.regex=^https://scoutssintjohannes.be/(.*)"
      - "traefik.http.middlewares.apex-to-www.redirectregex.replacement=https://www.scoutssintjohannes.be/$${1}"

  minio:
    image: minio/minio:latest
    container_name: minio-prod
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_DOMAIN: ${MINIO_DOMAIN:-localhost:9000}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`www.scoutssintjohannes.be`) && PathPrefix(`/media-cdn`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.tls=true"
      - "traefik.http.routers.minio.tls.certresolver=le"
      - "traefik.http.routers.minio.priority=100"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"

  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup-prod
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKETS: ${MINIO_BUCKETS:-}
    entrypoint: >
      /bin/sh -c " mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123} && for bucket in $(echo ${MINIO_BUCKETS:-} | tr ',' ' '); do
        if [ -n \"$bucket\" ]; then
          mc mb local/$bucket --ignore-existing;
          if [ \"$bucket\" = \"media-cdn\" ]; then
            mc anonymous set public local/$bucket || true;
          fi;
        fi;
      done && echo 'MinIO buckets ensured.' "
    networks:
      - app-network

  db:
    container_name: supabase-db-prod
    image: supabase/postgres:15.1.0.147
    restart: unless-stopped
    ports:
      - "0.0.0.0:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: postgres
    volumes:
      - ./supabase/volumes/db/data:/var/lib/postgresql/data:Z
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Supabase Studio for production database management
  postgres-meta:
    container_name: supabase-meta
    image: supabase/postgres-meta:v0.80.0
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  studio:
    container_name: supabase-studio-prod
    image: supabase/studio:20240422-5cf8f30
    restart: unless-stopped
    ports:
      - "0.0.0.0:${STUDIO_PORT:-54323}:3000"
    environment:
      STUDIO_PG_META_URL: http://postgres-meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: "Scouts Sint-Johannes"
      DEFAULT_PROJECT_NAME: "Kampvuurkring Production"
      SUPABASE_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-http://localhost:3000}
      SUPABASE_PUBLIC_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-http://localhost:3000}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      NEXT_PUBLIC_ENABLE_LOGS: false
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres
    env_file:
      - .env
    depends_on:
      - postgres-meta
    networks:
      - app-network

  backup:
    container_name: backup-prod
    build:
      context: ./backups
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      ENABLE_DB_BACKUP: "true"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKETS: ${MINIO_BUCKETS:-}
      ENABLE_MINIO_BACKUP: ${ENABLE_MINIO_BACKUP:-false}
      RCLONE_REMOTE: ${RCLONE_REMOTE_PROD:-}
      BACKUP_CRON: ${BACKUP_CRON_PROD:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      PROJECT_NAME: prod
      TZ: Europe/Brussels
    volumes:
      - /mnt/data/backups/data:/backups
      - /mnt/data/backups/rclone:/config/rclone:ro
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped
  # Optional: Nginx reverse proxy for production
  # nginx:
  #   container_name: nginx-prod
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - frontend
  #   networks:
  #     - app-network
  #   restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  letsencrypt:
  minio-data:
