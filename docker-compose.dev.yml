services:
  traefik:
    image: traefik:v3.1
    container_name: traefik-dev
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"  # Direct access for development
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - PAYLOAD_DROP_DATABASE=false
      - PAYLOAD_MIGRATE_EXISTING_TABLES=true
      - CDN_PUBLIC_URL=http://localhost:9000/media-cdn
    volumes:
      - ./frontend:/usr/src/app
      - ./frontend/media:/usr/src/app/media
      - ./frontend/banner-images:/usr/src/app/banner-images
      - ./frontend/homepage-hero-images:/usr/src/app/homepage-hero-images
      - ./frontend/leiders-foto:/usr/src/app/leiders-foto
      - /usr/src/app/node_modules
      - /usr/src/app/.next
    env_file:
      - .env
    entrypoint: []
    command: ["npm", "run", "dev"]
    depends_on:
      - db
      - traefik
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dev-site.rule=Host(`localhost`)"
      - "traefik.http.routers.dev-site.entrypoints=web"
      - "traefik.http.routers.dev-site.priority=1"
      - "traefik.http.services.dev-site.loadbalancer.server.port=3000"

  # MinIO S3-compatible object storage
  minio:
    image: minio/minio:latest
    container_name: minio-dev
    ports:
      - "9000:9000"   # MinIO API
      - "9001:9001"   # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_DOMAIN: localhost:9000
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO client for bucket setup
  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup-dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc rb local/images-cdn --force || true &&
      mc rb local/images-original --force || true &&
      mc rb local/media --force || true &&
      mc rb local/banner-images --force || true &&
      mc rb local/leiders-banners --force || true &&
      mc rb local/homepage-heros --force || true &&
      mc rb local/homepage-hero-images --force || true &&
      mc rb local/leiders-foto --force || true &&
      mc rb local/lokaal-fotos --force || true &&
      mc rb local/random-afbeelding --force || true &&
      mc rb local/random-afbeeldingen --force || true &&
      mc rb local/media-leiding --force || true &&
      mc rb local/random --force || true &&
      mc rb local/andere-banner --force || true &&
      mc rb local/takken-banner --force || true &&
      mc rb local/homepage-banner --force || true &&
      mc rb local/leiding --force || true &&
      mc rb local/lokaal --force || true &&
      mc mb local/media-original --ignore-existing &&
      mc mb local/media-cdn --ignore-existing &&
      mc anonymous set public local/media-cdn &&
      echo 'MinIO buckets created and configured!'
      "
    networks:
      - app-network

  # Static file server for media (keep for now during transition)
  media-server:
    image: nginx:alpine
    container_name: media-server-dev
    ports:
      - "8081:80"  # Direct access for testing
    volumes:
      - ./frontend/media:/usr/share/nginx/html/media:ro
      - ./frontend/banner-images:/usr/share/nginx/html/banner-images:ro
      - ./frontend/homepage-hero-images:/usr/share/nginx/html/homepage-hero-images:ro
      - ./frontend/leiders-foto:/usr/share/nginx/html/leiders-foto:ro
    networks:
      - app-network

  db:
    container_name: supabase-db
    image: supabase/postgres:15.1.0.147
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./supabase/volumes/db/data:/var/lib/postgresql/data:Z
    networks:
      - app-network

  # Minimal Supabase Studio setup
  postgres-meta:
    container_name: supabase-meta
    image: supabase/postgres-meta:v0.80.0
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - app-network
    depends_on:
      - db

  studio:
    container_name: supabase-studio
    image: supabase/studio:20240422-5cf8f30
    restart: unless-stopped
    ports:
      - "54323:3000"
    environment:
      STUDIO_PG_META_URL: http://postgres-meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: "Scouts Sint-Johannes"
      DEFAULT_PROJECT_NAME: "Kampvuurkring"
      SUPABASE_URL: http://localhost:8000
      SUPABASE_PUBLIC_URL: http://localhost:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      NEXT_PUBLIC_ENABLE_LOGS: false
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres
    depends_on:
      - postgres-meta
    networks:
      - app-network


networks:
  app-network:
    driver: bridge

volumes:
  data:
  minio-data: